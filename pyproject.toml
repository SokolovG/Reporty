[project]
name = "reporty"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"

license = { file = "LICENSE" }
authors = [{ name = "Grigoriy Sokolov", email = "Sokolov_Gr@proton.me" }]
dependencies = [
    "adaptix>=3.0.0b11",
    "advanced-alchemy>=1.4.4",
    "alembic>=1.16.1",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "click>=8.2.1",
    "cryptography>=45.0.3",
    "dishka>=1.6.0",
    "dotenv>=0.9.9",
    "itsdangerous>=2.2.0",
    "litestar>=2.16.0",
    "msgspec>=0.19.0",
    "pre-commit>=4.2.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.9.1",
    "pyjwt[crypto]>=2.10.1",
    "ruff>=0.11.12",
    "sqladmin-litestar-plugin>=0.2.0",
    "sqlalchemy>=2.0.41",
    "starlette>=0.47.0",
    "ty>=0.0.12",
    "uvicorn>=0.34.3",
]


[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 4
extend-exclude = ["tests", "alembic"]

[tool.ruff.lint]
ignore = [
    "D100",
    "D101",
    "D104",
    "D105",
    "D103",
    "D102",
    "D107",
    "D203",
    "D213",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
